<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Haldi – brass bowl of turmeric with marigolds</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9F3"/><stop offset="1" stop-color="#F4DDE0"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E6C98B"/><stop offset=".45" stop-color="#F6E7BD"/><stop offset="1" stop-color="#C9A46A"/></linearGradient>
    <path id="leaf" d="M0 0C8-13 24-13 34 0 24 13 8 13 0 0Z"/>
    <g id="mari">
      <g fill="#F2A93B" stroke="#D78A22" stroke-width="1">
        <ellipse cy="-18" rx="7.500" ry="13"/>
        <ellipse cy="-18" rx="7.500" ry="13" transform="rotate(30)"/>
        <ellipse cy="-18" rx="7.500" ry="13" transform="rotate(60)"/>
        <ellipse cy="-18" rx="7.500" ry="13" transform="rotate(90)"/>
        <ellipse cy="-18" rx="7.500" ry="13" transform="rotate(120)"/>
        <ellipse cy="-18" rx="7.500" ry="13" transform="rotate(150)"/>
        <ellipse cy="-18" rx="7.500" ry="13" transform="rotate(180)"/>
        <ellipse cy="-18" rx="7.500" ry="13" transform="rotate(210)"/>
        <ellipse cy="-18" rx="7.500" ry="13" transform="rotate(240)"/>
        <ellipse cy="-18" rx="7.500" ry="13" transform="rotate(270)"/>
        <ellipse cy="-18" rx="7.500" ry="13" transform="rotate(300)"/>
        <ellipse cy="-18" rx="7.500" ry="13" transform="rotate(330)"/>
      </g>
      <g fill="#F8CB5A" stroke="#E0A030" stroke-width=".8">
        <ellipse cy="-11" rx="5.500" ry="9" transform="rotate(15)"/>
        <ellipse cy="-11" rx="5.500" ry="9" transform="rotate(60)"/>
        <ellipse cy="-11" rx="5.500" ry="9" transform="rotate(105)"/>
        <ellipse cy="-11" rx="5.500" ry="9" transform="rotate(150)"/>
        <ellipse cy="-11" rx="5.500" ry="9" transform="rotate(195)"/>
        <ellipse cy="-11" rx="5.500" ry="9" transform="rotate(240)"/>
        <ellipse cy="-11" rx="5.500" ry="9" transform="rotate(285)"/>
        <ellipse cy="-11" rx="5.500" ry="9" transform="rotate(330)"/>
      </g>
      <circle r="6" fill="#E8892A" stroke="#C9731C" stroke-width="1"/>
    </g>
    <ellipse id="petal" rx="4.500" ry="8" fill="#F5B942" stroke="#D78A22" stroke-width=".8"/>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- glow: rays + dotted ring -->
  <circle cx="200" cy="300" r="156" stroke="#C9A46A" stroke-width="1.6" stroke-dasharray="0.1 9" opacity=".9"/>
  <circle cx="200" cy="300" r="132" fill="#FFFDF9" opacity=".75"/>
  <g stroke="#E3C27C" stroke-width="2" opacity=".9">
    <path d="M200 134V112"/><path d="M200 134V112" transform="rotate(22.500 200 300)"/><path d="M200 134V112" transform="rotate(-22.500 200 300)"/>
    <path d="M200 134V112" transform="rotate(45 200 300)"/><path d="M200 134V112" transform="rotate(-45 200 300)"/>
    <path d="M200 134V112" transform="rotate(67.500 200 300)"/><path d="M200 134V112" transform="rotate(-67.500 200 300)"/>
    <path d="M200 134V112" transform="rotate(90 200 300)"/><path d="M200 134V112" transform="rotate(-90 200 300)"/>
  </g>

  <!-- leaves behind the flowers -->
  <g stroke="#7F9275" stroke-width="1.4" fill="#A7B49A">
    <use href="#leaf" transform="translate(168 300) rotate(-168) scale(1.7)"/>
    <use href="#leaf" transform="translate(232 300) rotate(-12) scale(1.7)"/>
    <use href="#leaf" transform="translate(184 232) rotate(-125) scale(1.5)"/>
    <use href="#leaf" transform="translate(216 232) rotate(-55) scale(1.5)"/>
    <use href="#leaf" transform="translate(130 324) rotate(-150) scale(1.3)"/>
    <use href="#leaf" transform="translate(270 324) rotate(-30) scale(1.3)"/>
  </g>

  <!-- marigolds -->
  <use href="#mari" transform="translate(150 282) scale(1.05)"/>
  <use href="#mari" transform="translate(250 282) scale(1.05)"/>
  <use href="#mari" transform="translate(200 246) scale(1.4)"/>

  <!-- brass bowl -->
  <path d="M104 332H296C296 392 258 428 200 428C142 428 104 392 104 332Z" fill="url(#brass)" stroke="#B98F4D" stroke-width="3"/>
  <ellipse cx="200" cy="332" rx="96" ry="16" fill="#F6E7BD" stroke="#B98F4D" stroke-width="3"/>
  <path d="M112 330C130 298 270 298 288 330C262 346 138 346 112 330Z" fill="#EDB93A" stroke="#C98F1E" stroke-width="2"/>
  <path d="M132 326C160 314 240 314 268 326" stroke="#F8D775" stroke-width="2.4"/>
  <path d="M112 364C146 384 254 384 288 364" stroke="#B98F4D" stroke-width="1.8"/>
  <path d="M122 384C154 402 246 402 278 384" stroke="#B98F4D" stroke-width="1.4" stroke-dasharray="0.1 6"/>
  <path d="M168 428H232L240 442H160Z" fill="#E6C98B" stroke="#B98F4D" stroke-width="2.4"/>

  <!-- falling petals -->
  <use href="#petal" transform="translate(92 244) rotate(-40)"/>
  <use href="#petal" transform="translate(70 306) rotate(30)"/>
  <use href="#petal" transform="translate(318 240) rotate(50)"/>
  <use href="#petal" transform="translate(336 316) rotate(-30)"/>
  <use href="#petal" transform="translate(110 420) rotate(60)"/>
  <use href="#petal" transform="translate(300 424) rotate(-50)"/>
  <use href="#petal" transform="translate(330 172) rotate(20)"/>
  <use href="#petal" transform="translate(76 178) rotate(-20)"/>

  <g fill="#C9A46A">
    <circle cx="130" cy="150" r="2.400"/><circle cx="276" cy="156" r="2"/><circle cx="58" cy="380" r="2"/><circle cx="344" cy="380" r="2.400"/>
  </g>
</svg>
